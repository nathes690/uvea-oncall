<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UVEA Splash</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0f2a33;      /* teal-dark fallback behind the video */
    overflow: hidden;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: cover;        /* fill the frame, no letterboxing */
    display: block;
  }
  /* Tap-to-play overlay: only shown if autoplay is blocked */
  #tap {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(15, 42, 51, 0.55);
    color: #fff;
    font-family: -apple-system, "Public Sans", system-ui, sans-serif;
    font-size: 1rem;
    letter-spacing: 0.02em;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #tap span {
    padding: 0.6rem 1.1rem;
    border: 1px solid rgba(255,255,255,0.7);
    border-radius: 999px;
  }
</style>
</head>
<body>
  <div id="wrap">
    <video id="v" autoplay muted loop playsinline preload="auto"
           src="https://nathes690.github.io/uvea-oncall/Uveitis%20Possiblities%20Movie.mp4">
    </video>
  </div>

  <div id="tap"><span>Tap to play</span></div>

  <script>
    var v = document.getElementById('v');
    var tap = document.getElementById('tap');

    // Try to autoplay. If the browser blocks it, reveal the tap overlay.
    function tryPlay() {
      var p = v.play();
      if (p && typeof p.then === 'function') {
        p.catch(function () { tap.style.display = 'flex'; });
      }
    }
    tryPlay();

    tap.addEventListener('click', function () {
      tap.style.display = 'none';
      v.play();
    });
  </script>
</body>
</html>
